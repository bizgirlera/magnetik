<style>
:root{
  --bg:#F5F0FF; --surface:#FFFFFF; --ink:#2A1B47; --muted:#7A6D96; --line:#E7DEFA;
  --violet:#7B3FF2; --violet-soft:#EDE3FF; --rose:#FF6FA8; --orange:#FF8A3D;
  --turq:#1FC7B6; --lime:#D7F24A; --gold:#FFB938; --on-accent:#FFFFFF;
  --radius-xl:32px; --radius-l:24px; --radius-m:16px;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1230; --surface:#261B45; --ink:#F4EEFF; --muted:#B3A6D1; --line:#3A2C63;
    --violet:#9B6BFF; --violet-soft:#33255A;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1230; --surface:#261B45; --ink:#F4EEFF; --muted:#B3A6D1; --line:#3A2C63;
  --violet:#9B6BFF; --violet-soft:#33255A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:12px}
.app{max-width:460px;margin:0 auto;padding:20px 18px 120px;min-height:100vh}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack>*+*{margin-top:14px}
.hidden{display:none!important}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--lime);color:#2A1B47;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem}
.streak-pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:700}

/* Hero card */
.hero{position:relative;border-radius:var(--radius-xl);padding:22px;background:linear-gradient(135deg,var(--violet) 0%,#B06BFF 55%,var(--rose) 100%);color:#fff;overflow:hidden;min-height:180px}
.hero h2{color:#fff;max-width:62%;font-size:1.5rem}
.hero p{max-width:60%;opacity:.92;margin-top:8px;font-size:.95rem}
.mascot{display:block;width:100%;height:auto}
.progress{height:10px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:18px;max-width:60%;overflow:hidden}
.progress span{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .4s}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius-l);padding:18px;border:1.5px solid var(--line)}
.today{border:0;padding:0;overflow:hidden}
.today .band{padding:16px 18px;color:#2A1B47}
.today .inner{padding:16px 18px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:5px 12px;border-radius:999px;color:#2A1B47}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:999px;font-weight:700;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--violet);color:#fff}
.btn-lime{background:var(--lime);color:#2A1B47}
.btn-ghost{background:var(--violet-soft);color:var(--violet)}
.btn-block{width:100%}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{border-radius:var(--radius-l);padding:16px;color:#2A1B47;text-align:left;min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
.mini strong{font-family:var(--display);font-size:2rem;line-height:1}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{border-radius:var(--radius-m);padding:14px;text-align:left;color:#2A1B47;border:3px solid transparent;display:flex;flex-direction:column;gap:4px}
.type span{font-size:1.4rem}
.type b{font-family:var(--display);font-weight:600}
.type small{font-size:.78rem;opacity:.8;line-height:1.3}
.type[aria-pressed="true"]{border-color:var(--ink)}

label.field{display:block;font-weight:600;font-size:.9rem}
.input{width:100%;margin-top:6px;padding:14px 16px;border-radius:var(--radius-m);border:1.5px solid var(--line);background:var(--surface);outline:none}
.input:focus{border-color:var(--violet)}
.prompt-box{background:var(--violet-soft);border-radius:var(--radius-m);padding:16px;font-size:.9rem;white-space:pre-wrap;max-height:260px;overflow:auto;color:var(--ink)}

/* Contacts */
.contact{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius-m)}
.contact .ini{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--display);color:#2A1B47;flex:none}
.contact .info{flex:1;min-width:0}
.contact .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact .info small{color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet);font-size:1.1rem;flex:none}
.empty{text-align:center;padding:28px 18px}
.empty .mascot{width:110px;margin:0 auto 10px}

.lock{text-align:left;width:100%;background:linear-gradient(135deg,var(--violet-soft),var(--surface));border-style:dashed}
.steps{display:flex;gap:4px;margin-top:6px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.stepper{display:flex;gap:6px}.stepper div{flex:1;text-align:center}.stepper i{display:block;height:8px;border-radius:9px;background:var(--c,var(--line));margin-bottom:4px}
.stepper small{font-size:.7rem;color:var(--muted)}.stepper .now small{color:var(--ink);font-weight:700}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hist{margin:8px 0 0;padding-left:18px;font-size:.88rem}.hist li{margin-bottom:4px}
.contact[role="button"]{cursor:pointer}
.seg{display:flex;background:var(--violet-soft);border-radius:999px;padding:4px}
.seg button{flex:1;padding:10px 6px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--violet)}
.seg button b{display:inline-block;min-width:22px;padding:1px 6px;border-radius:99px;background:var(--surface);color:var(--ink);font-size:.78rem;margin-left:4px}
.seg button[aria-pressed="true"]{background:var(--violet);color:#fff}
.chip.small{padding:7px 12px;font-size:.82rem}
.late{margin:0;font-size:.85rem;font-weight:600;color:#D9480F}.late-txt{color:#D9480F;font-weight:700}
.big{padding:18px;font-size:1.05rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wday{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);border-bottom:5px solid var(--c)}
.wday small{font-size:.7rem;color:var(--muted);font-weight:700}.wday span{font-size:1.1rem}
.wday.now{border-color:var(--violet);border-bottom-color:var(--c);border-width:2.5px 2.5px 5px}
.wday.done{background:var(--c);color:#2A1B47}.wday.done small{color:#2A1B47}
.legend{gap:14px;margin-top:8px;font-size:.75rem;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.checklist{display:flex;flex-direction:column;gap:6px}
.check{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:14px}
.check .box{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;flex:none;background:var(--surface)}
.check.on .box{background:var(--lime);border-color:var(--lime);color:#2A1B47}
.check .lbl{flex:1;font-size:.92rem}.check.on .lbl{color:var(--muted);text-decoration:line-through}
.check .go{width:32px;height:32px;border-radius:50%;background:var(--violet-soft);color:var(--violet);font-weight:800;flex:none}
.lev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lev{display:flex;flex-direction:column;gap:2px;padding:12px 10px;border-radius:18px;text-align:left;background:var(--surface);border:2px solid var(--line);border-top:6px solid var(--c)}
.lev span{font-size:1.2rem}.lev b{font-family:var(--display);font-size:.95rem}.lev small{font-size:.72rem;color:var(--muted);line-height:1.25}
.lev[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#2A1B47}.lev[aria-pressed="true"] small{color:#2A1B47}
.setup summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none}.setup summary::-webkit-details-marker{display:none}
.setup summary .box{width:40px;height:40px;border-radius:12px;background:var(--violet-soft);display:grid;place-items:center;flex:none;font-weight:800}
.setup.done summary .box{background:var(--lime);color:#2A1B47}
.setup summary b{display:block}.setup summary small{color:var(--muted);font-size:.82rem;line-height:1.3;display:block}
.bar{display:grid;grid-template-columns:minmax(0,1.2fr) 1fr auto;align-items:center;gap:10px;font-size:.88rem}
.bar div{height:12px;background:var(--violet-soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--violet);border-radius:99px}
.bar b{min-width:20px;text-align:right}
.insight{background:var(--violet-soft);border-color:transparent}
.mini small{font-size:.75rem;opacity:.8}
.lev-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.lev{min-width:0}.lev b{font-size:.84rem;white-space:nowrap}
details.card{display:block}details.card>div{width:100%}.btn-block{max-width:100%}
.nav-in{gap:2px}.nav button{min-width:0;flex:1}
@media (max-width:370px){
  .app{padding-left:12px;padding-right:12px}
  .nav{padding-left:10px;padding-right:10px}
  .nav button{padding:8px 4px;font-size:.66rem}
  .lev{padding:10px 8px}.lev small{display:none}
  .types,.opt-grid,.mini-grid,.answers{gap:8px}
  .seg button{font-size:.8rem;padding:9px 4px}
  .week{gap:4px}.wday{padding:8px 0}
  h1{font-size:1.7rem}
}
.legal-body h3{font-size:1rem;margin:18px 0 6px}.legal-body p,.legal-body li{font-size:.88rem;line-height:1.55}.legal-body ul{padding-left:18px;margin:6px 0}
.linkish{color:var(--violet);text-decoration:underline;font-weight:600;padding:0;font-size:inherit}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;line-height:1.45}
.consent input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--violet)}
.danger{background:#FFE3E3;color:#C92A2A}
.big-av{width:60px;height:60px;font-size:1.5rem;flex:none}
.menu{display:flex;flex-direction:column;background:var(--violet-soft);border-radius:var(--radius-l);overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;padding:16px;text-align:left;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}.menu b{flex:1;font-weight:600}.menu i{font-style:normal;color:var(--muted);font-size:1.2rem}
.danger-txt{color:#C92A2A}
.ed-l{display:block;font-size:.9rem;margin-bottom:6px}
select.input{appearance:auto}
.sheet.still{animation:none}
.auth{gap:16px}.auth-foot{font-size:.75rem;margin-top:8px}
.steps-list{margin:0;padding-left:20px;line-height:1.7}
.demo-note{margin:0;padding:10px 14px;border-radius:14px;background:#FFF4D6;color:#7A5A00;font-size:.82rem}
.code-in{font-size:1.6rem;letter-spacing:.5em;text-align:center;font-family:var(--display);font-weight:800}
.btn[disabled],.linkish[disabled]{opacity:.55;cursor:default}
/* 30 days */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.day{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);position:relative}
.day.done{color:#2A1B47;border-color:transparent}
.day.current{border:3px solid var(--violet)}
.day.done::after{content:"✓";position:absolute;top:4px;right:7px;font-size:.7rem}

/* Nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(460px,100%);padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.nav-in{display:flex;justify-content:space-around;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;border-radius:999px;font-size:.72rem;font-weight:700;color:var(--muted)}
.nav button span{font-size:1.25rem;line-height:1}
.nav button[aria-current="page"]{background:var(--lime);color:#2A1B47}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(26,18,48,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:min(460px,100%);border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px}

/* Onboarding */
.onb{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:12px 0}
.onb .mascot{width:150px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.dots i.on{width:24px;background:var(--violet)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px;border-radius:var(--radius-m);border:1.5px solid var(--line);background:var(--surface);font-weight:600;text-align:left}
.opt[aria-pressed="true"]{background:var(--violet);color:#fff;border-color:var(--violet)}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:30;animation:up .2s}
.float{animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav class="nav hidden" id="nav" aria-label="Navigation">
  <div class="nav-in">
    <button data-tab="home"><span>☀️</span>Aujourd'hui</button>
    <button data-tab="create"><span>✨</span>Créer</button>
    <button data-tab="contacts"><span>🧲</span>Prospects</button>
    <button data-tab="stats"><span>📊</span>Stats</button>
  </div>
</nav>
<div id="layer"></div>

<script>
/* ---------- Données ---------- */
const LEVIERS={
  visibilite:{name:"Visibilité",emoji:"📣",color:"#7FE3D8",desc:"Toucher de nouvelles personnes"},
  confiance:{name:"Confiance",emoji:"🤝",color:"#FF9CC5",desc:"Transformer les curieuses en fans"},
  conversion:{name:"Conversion",emoji:"💌",color:"#FFB27A",desc:"Faire écrire en message privé"}
};
const TYPES = {
  conseil:{levier:"visibilite",name:"Conseil",emoji:"💡",color:"#7FE3D8",hint:"Une astuce à enregistrer",brief:"un contenu conseil : une astuce vraiment utile et concrète liée à mon univers, que la personne a envie d'enregistrer et de partager, même sans acheter"},
  tendance:{levier:"visibilite",name:"Tendance",emoji:"🔥",color:"#A8E6DF",hint:"Surfe sur un format viral",brief:"un contenu qui reprend un format tendance (son, trend, POV, mème ou format viral) adapté à mon univers, pour toucher un maximum de nouvelles personnes. Décris précisément le format à reproduire"},
  humour:{levier:"visibilite",name:"Humour",emoji:"😂",color:"#B8F0D8",hint:"Fais sourire et partager",brief:"un contenu humoristique : une situation du quotidien drôle et très relatable liée à mon univers, qui donne envie de taguer une amie"},
  question:{levier:"visibilite",name:"Question",emoji:"🙋‍♀️",color:"#C9F2EC",hint:"Fais parler ta communauté",brief:"un contenu question : lance une discussion simple et engageante, avec une question facile à laquelle répondre en commentaire"},
  motivation:{levier:"visibilite",name:"Motivation",emoji:"🌈",color:"#A8C8FF",hint:"Inspire et fais du bien",brief:"un contenu inspirant : une pensée positive ou une réflexion personnelle qui fait du bien, en lien subtil avec mon univers"},
  temoignage:{levier:"confiance",name:"Témoignage",emoji:"💖",color:"#FF9CC5",hint:"Un retour client ou ton avis",brief:"un contenu témoignage : un ressenti concret et honnête sur le produit (le mien ou celui d'une cliente qui a donné son accord), avec des détails du quotidien"},
  coulisses:{levier:"confiance",name:"Coulisses",emoji:"🎬",color:"#FFB3D1",hint:"Montre ton quotidien",brief:"un contenu coulisses : un moment réel de mon activité, simple et authentique, qui donne l'impression d'être avec moi"},
  histoire:{levier:"confiance",name:"Mon histoire",emoji:"🌱",color:"#C3A6FF",hint:"Raconte-toi",brief:"un contenu storytelling : un moment personnel lié à mon activité, avec une émotion vraie et une petite leçon à la fin"},
  motcle:{levier:"conversion",name:"Mot-clé",emoji:"🔑",color:"#FFB27A",hint:"Commente pour recevoir",brief:"un contenu qui donne envie de commenter un mot-clé précis pour recevoir en message privé quelque chose de gratuit et utile (guide, sélection, astuce, conseil personnalisé, échantillon…). Propose le mot-clé et ce que j'envoie"},
  tester:{levier:"conversion",name:"Qui veut tester ?",emoji:"🎁",color:"#FFC98F",hint:"Fais lever la main",brief:"un contenu qui propose à un petit nombre de personnes de tester ou découvrir gratuitement quelque chose (échantillon, démo, conseil perso, atelier découverte) en levant la main en commentaire ou en message privé"},
  quiz:{levier:"conversion",name:"Quiz",emoji:"🧩",color:"#FFD57A",hint:"Résultat perso en privé",brief:"un mini-quiz ou diagnostic (du type « Quel est ton profil… ? ») dont la personne reçoit le résultat détaillé ou un conseil personnalisé en message privé"},
  live:{levier:"conversion",name:"Live / atelier",emoji:"🔴",color:"#FFA8A8",hint:"Fais s'inscrire",brief:"un contenu qui annonce un live, un atelier ou une visio et donne envie de s'inscrire en commentant ou en écrivant en message privé"},
  promo:{levier:"conversion",name:"Présentation douce",emoji:"🛍️",color:"#FFE0A3",hint:"Présente sans forcer",brief:"un contenu de présentation tout en douceur : 2 ou 3 bénéfices concrets, sans pression, avec une invitation à m'écrire en privé pour en savoir plus"}
};
const IDEAS={
  conseil:["Une astuce simple liée à ton univers","Les 3 erreurs les plus courantes","Mythe ou réalité dans ton univers","Un mini-tuto en quelques étapes"],
  tendance:["Adapte un son tendance à ton univers","Un format « POV » sur ton quotidien","Une trend « avant / maintenant »"],

/* ---------- Onboarding ---------- */
let onbStep=0, onbData={...DEFAULT_PROFILE}, legalTick=false;
const STEPS=6;
function single(key,cur){return `<div><b style="font-size:.9rem">${OPTS[key].label}</b><div class="chips wrap" style="margin-top:8px">${Object.entries(OPTS[key].items).map(([k,v])=>`<button class="chip" data-single="${key}" data-v="${k}" aria-pressed="${cur===k}">${v}</button>`).join("")}</div></div>`}
function multi(key,list,cur,label){return `<div>${label?`<b style="font-size:.9rem">${label}</b>`:""}<div class="chips wrap" style="margin-top:8px">${list.map(v=>`<button class="chip" data-multi="${key}" data-v="${esc(v)}" aria-pressed="${cur.includes(v)}">${esc(v)}</button>`).join("")}</div></div>`}
function onboarding(){
  const d=onbData;
  const dots=`<div class="dots">${Array.from({length:STEPS},(_,i)=>`<i class="${i===onbStep?"on":""}"></i>`).join("")}</div>`;
  const back=onbStep>0?`<button class="btn btn-ghost" id="back" style="padding:10px 16px">Retour</button>`:"";
  let body="";
  if(onbStep===0) body=`
    <div class="float" style="width:150px">${mascot("happy","#E4F58A")}</div>
    <h1>Bienvenue sur Magnétik.</h1>
    <p class="muted">Je t'aide à savoir quoi poster et qui relancer, en 10 minutes par jour. Plus tu me donnes de détails, plus mes idées te ressembleront.</p>
    <label class="field">Ton prénom<input class="input" id="f-name" value="${esc(d.name)}" placeholder="Sarah" autocomplete="given-name"></label>
    ${S.legal===LEGAL_VERSION?"":`<label class="consent"><input type="checkbox" id="f-legal" ${legalTick?"checked":""}><span>J'ai lu et j'accepte les <button class="linkish" data-lg="cgu">conditions d'utilisation</button> et la <button class="linkish" data-lg="confidentialite">politique de confidentialité</button>. Je confirme être majeure.</span></label>`}
    <p class="muted" style="font-size:.75rem">Aucun résultat n'est garanti. <button class="linkish" data-lg="mentions">Mentions légales</button></p>`;
  if(onbStep===1) body=`
    <h1>Tu vends dans quel univers ?</h1>
    <div class="opt-grid">${UNIVERS.map(u=>`<button class="opt" aria-pressed="${d.univers===u}" data-u="${esc(u)}">${esc(u)}</button>`).join("")}</div>
    ${d.univers==="✨ Autre"?`<label class="field">Précise ton univers<input class="input" id="f-autre" value="${esc(d.universAutre)}" placeholder="Ex. : produits ménagers écologiques"></label>`:""}`;
  if(onbStep===2) body=`
    <h1>Ton produit et tes clientes</h1>
    <label class="field">Ta marque (facultatif)<input class="input" id="f-marque" value="${esc(d.marque)}" placeholder="Nom de la marque"></label>
    <label class="field">Ton produit phare<input class="input" id="f-produit" value="${esc(d.produit)}" placeholder="Ex. : le sérum à l'aloe vera"></label>
    ${multi("cibles",CIBLES,d.cibles,"Tu t'adresses surtout à…")}
    <label class="field">Ta cliente idéale en quelques mots (facultatif)<input class="input" id="f-cible" value="${esc(d.cibleDetail)}" placeholder="Ex. : mamans débordées qui veulent prendre soin d'elles"></label>`;
  if(onbStep===3) body=`
    <h1>Ton style d'écriture</h1>
    ${multi("tons",TONS,d.tons,"Ton ton (jusqu'à 3)")}
    ${single("adresse",d.adresse)}
    ${single("emojis",d.emojis)}
    ${single("longueur",d.longueur)}`;
  if(onbStep===4) body=`
    <h1>Ta façon de créer</h1>
    ${single("visage",d.visage)}
    ${multi("plateformes",PLATEFORMES,d.plateformes,"Où tu publies")}
    ${single("format",d.format).replace(OPTS.format.label,"Ton format préféré")}`;
  if(onbStep===5) body=`
    <div style="width:140px">${mascot("neutral","#FF9CC5")}</div>
    <h1>Un dernier détail sur toi ?</h1>
    <p class="muted">Ce qui te rend unique et que tu aimes partager : ta vie, tes passions, ton caractère. Je le glisserai naturellement dans tes posts.</p>
    <label class="field">Facultatif<textarea class="input" id="f-sign" rows="3" placeholder="Ex. : maman de 2 garçons, fan de rando, je vis à la campagne">${esc(d.signature)}</textarea></label>`;
  $("#app").innerHTML=`<section class="onb">${dots}${body}
    <div class="row">${back}<button class="btn btn-primary" style="flex:1" id="next">${onbStep===STEPS-1?"C'est parti !":"Continuer"}</button></div></section>`;
  const keep=()=>{const g=id=>{const e=$(id);return e?e.value.trim():null};
    const map={"#f-name":"name","#f-autre":"universAutre","#f-marque":"marque","#f-produit":"produit","#f-cible":"cibleDetail","#f-sign":"signature"};
    for(const [id,k] of Object.entries(map)){const v=g(id);if(v!==null)d[k]=v}};
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{keep();d.univers=b.dataset.u;onboarding()});
  document.querySelectorAll("[data-single]").forEach(b=>b.onclick=()=>{keep();d[b.dataset.single]=b.dataset.v;onboarding()});
  document.querySelectorAll("[data-multi]").forEach(b=>b.onclick=()=>{keep();const k=b.dataset.multi,v=b.dataset.v,arr=d[k];

  if($("#f-legal"))$("#f-legal").onchange=e=>legalTick=e.target.checked;

    if(onbStep===1&&!d.univers)return toast("Choisis ton univers");
    if(onbStep===1&&d.univers==="✨ Autre"&&!d.universAutre)return toast("Précise ton univers");
    if(onbStep===2&&!d.produit)return toast("Ajoute ton produit phare");
    if(onbStep===3&&!d.tons.length)return toast("Choisis au moins un ton");
    if(onbStep===4&&!d.plateformes.length)return toast("Choisis au moins une plateforme");
    if(onbStep<STEPS-1){onbStep++;window.scrollTo(0,0);return onboarding()}
    S.profile={...d};save();tab="home";render();if(pendingInstall){pendingInstall=false;setTimeout(()=>installSheet(true),900)}
  };
}

  post:len=>`Format : une légende de post de ${len}. Le HOOK est la première ligne (visible avant le « voir plus »), puis PONT, VALEUR et CTA s'enchaînent en paragraphes courts. Propose aussi l'idée de photo qui l'accompagne.`,
  carrousel:()=>`Format : un carrousel de 6 à 8 slides. Slide 1 = HOOK (donne envie de swiper), slide 2 = PONT, slides suivantes = VALEUR (une idée par slide), dernière slide = CTA. Donne le texte court de chaque slide, puis une légende qui suit elle aussi Hook, Pont, Valeur, CTA.`,
  reel:()=>`Format : un script de Reel / TikTok de 15 à 30 secondes, découpé ainsi : HOOK (0 à 3 s), PONT (3 à 6 s), VALEUR (le cœur de la vidéo), CTA (les dernières secondes). Pour chaque partie, donne ce qu'on voit à l'écran, le texte affiché et ce qui est dit (ou la voix off). Ajoute une idée de son ou de tendance adaptée, puis une légende qui suit Hook, Pont, Valeur, CTA.`,
  story:()=>`Format : une séquence de 4 à 6 stories. Story 1 = HOOK, story 2 = PONT, stories suivantes = VALEUR, dernière story = CTA avec un sticker interactif (sondage, quiz, question, curseur ou lien). Pour chaque story, donne ce qu'on voit et le texte à l'écran.`,
  statut:()=>`Format : 3 statuts WhatsApp qui se suivent dans la journée : statut 1 = HOOK, statut 2 = PONT + VALEUR, statut 3 = CTA. Pour chacun, donne le texte et l'idée de visuel.`,
  live:()=>`Format : le plan d'un live de 15 à 20 minutes structuré ainsi : HOOK (titre et première minute pour retenir les gens), PONT (pourquoi ce sujet, pour qui), VALEUR (3 parties concrètes + moment de questions), CTA (conclusion). Ajoute ensuite un court post d'annonce du live qui suit lui aussi Hook, Pont, Valeur, CTA.`

const CTA_BRIEF={

};

  oui:"Je suis à l'aise face caméra : tu peux proposer des plans où je parle face caméra.",
  parfois:"Mélange des plans face caméra et des plans sans visage.",
  non:"Je ne montre JAMAIS mon visage : propose uniquement des visuels et plans sans visage (mains, produit, décor, ambiance, texte à l'écran, voix off ou sous-titres)."
};

Mon contexte :
- Je m'appelle ${p.name} et je vends dans l'univers : ${univ}${p.marque?` (marque : ${p.marque})`:""}.

${cible?`- Ma communauté et mes clientes : ${cible}.\n`:""}${p.signature?`- Un peu de moi (à glisser naturellement si c'est pertinent) : ${p.signature}.\n`:""}

Ta mission : crée ${T.brief}.
${CIBLE_BRIEF[c.cible]}
${c.subject?`Sujet précis : ${c.subject}.\n`:""}Objectif : ${OBJ[c.objectif]}.

${VISAGE_BRIEF[c.visage]}

Structure obligatoire, dans cet ordre :

/* ---------- Capture de prospect ---------- */
function captureSheet(pre={}){
  const P=!!S.premium;
  let source=pre.source||"motcle", track=pre.track||"cliente";
  const draw=()=>{
  sheet(`<div class="stack">
    <h2>Nouveau prospect</h2>
    <label class="field">Prénom ou pseudo<input class="input" id="kn" placeholder="Julie" autocomplete="off"></label>
    <div><b style="font-size:.9rem">D'où elle vient ?</b>
      <div class="opt-grid" style="margin-top:6px">${Object.entries(SOURCES).map(([k,s])=>`<button class="opt" data-src="${k}" aria-pressed="${source===k}">${s.emoji} ${s.name}</button>`).join("")}</div></div>
    ${P?`<div><b style="font-size:.9rem">Elle s'intéresse à…</b><div class="opt-grid" style="margin-top:6px"><button class="opt" data-ktr="cliente" aria-pressed="${track==="cliente"}">🛍️ Tes produits</button><button class="opt" data-ktr="revenu" aria-pressed="${track==="revenu"}">💼 Un complément de revenu</button></div></div>`:""}
    <label class="field">Note (facultatif)<input class="input" id="knote" placeholder="Ex. : a commenté « GUIDE » sous le reel du 12"></label>
    <button class="btn btn-primary btn-block" id="kSave">Ajouter et voir le premier message</button></div>`);
  const keep=()=>({n:$("#kn").value,note:$("#knote").value});
  document.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{const k=keep();source=b.dataset.src;draw();$("#kn").value=k.n;$("#knote").value=k.note});
  document.querySelectorAll("[data-ktr]").forEach(b=>b.onclick=()=>{const k=keep();track=b.dataset.ktr;draw();$("#kn").value=k.n;$("#knote").value=k.note});
  $("#kSave").onclick=()=>{
    const name=$("#kn").value.trim(); if(!name)return toast("Ajoute un prénom");
    const c={id:Date.now().toString(36),name,stage:"premier",track,source,note:$("#knote").value.trim(),besoin:"",history:[],tries:0,created:today(),maxStage:0,next:today()};
    S.contacts.push(c); markRoutine("reactions"); save();
    firstMessageSheet(c,pre.firstText);
  };};
  draw();
}
const firstMsg=(c)=>FIRST_MSG[c.source]?FIRST_MSG[c.source][c.track==="revenu"?1:0]:null;
function firstMessageSheet(c,custom){
  const txt=fillDM(custom||firstMsg(c)||STAGES_C.premier.msgs[0][1],c);
  sheet(`<div class="stack">
    <div class="row between"><h2>${esc(c.name)}</h2><span class="tag" style="background:var(--lime)">${SOURCES[c.source].emoji} ${SOURCES[c.source].name}</span></div>
    <p class="muted">Écris-lui maintenant, tant qu'elle a toi en tête. Le but du premier message : ouvrir la conversation, pas vendre.</p>
    <div class="prompt-box">${esc(txt)}</div>
    <button class="btn btn-primary btn-block" id="fmCopy">Copier le message</button>
    <button class="btn btn-lime btn-block" id="fmSent">C'est envoyé</button>
    <button class="btn btn-ghost btn-block" data-close>Plus tard</button></div>`,()=>{if(tab==="contacts")contacts();else render()});
  $("#fmCopy").onclick=()=>copy(txt);
  $("#fmSent").onclick=()=>{c.history.push({d:today(),t:"Premier message envoyé"});c.next=addDays(2);save();closeSheet();toast(`Parfait ! On vérifie sa réponse ${fmtD(c.next)}`)};
}

function fillDM(t,c){const p=S.profile;const [theme,question,essai,ex]=U();
  return t.replaceAll("{p}",c.name).replaceAll("{produit}",p.produit).replaceAll("{theme}",theme).replaceAll("{question}",question)
   .replaceAll("{essai}",essai).replaceAll("{marque}",p.marque?` de ${p.marque}`:"").replaceAll("{besoin}",c.besoin||"ce que tu m'as dit")}

function groupsDef(){
  return S.premium?[
    ["all","Toutes les étapes",()=>true],
    ["nouveaux","🌱 Nouveaux",c=>c.stage==="premier"],
    ["discussion","💬 En discussion",c=>["decouverte","proposition"].includes(c.stage)],
    ["reflexion","🤔 En réflexion",c=>c.stage==="suivi"],
    ["clientes","💛 Clientes",c=>c.stage==="cliente"&&c.track!=="revenu"],
    ["partenaires","🤝 Partenaires",c=>c.stage==="cliente"&&c.track==="revenu"],
    ["pause","🌙 En pause",c=>c.stage==="pause"]
  ]:[
    ["all","Toutes",()=>true],
    ["nouveaux","🌱 À contacter",c=>c.stage==="premier"],
    ["discussion","💬 Intéressées",c=>["decouverte","proposition","suivi"].includes(c.stage)],
    ["clientes","💛 Clientes",c=>c.stage==="cliente"],
    ["pause","🌙 Pas maintenant",c=>c.stage==="pause"]
  ];
}
function contacts(){
  const P=!!S.premium, T=today(), wk=addDays(7);
  const timeF={due:c=>c.next<=T,week:c=>c.next<=wk,all:()=>true};
  const q=cSearch.trim().toLowerCase();
  const base=S.contacts.filter(c=>(!q||(c.name+" "+(c.note||"")+" "+(c.besoin||"")).toLowerCase().includes(q))&&(!P||cTrack==="all"||(c.track||"cliente")===cTrack));
  const G=groupsDef(); if(!G.find(g=>g[0]===cGroup))cGroup="all";
  const gFn=G.find(g=>g[0]===cGroup)[2];
  const inTime=base.filter(timeF[cTime]);
  const list=inTime.filter(gFn).sort((a,b)=>a.next.localeCompare(b.next));
  const late=S.contacts.filter(c=>c.next<T).length;
  const cnt=f=>base.filter(f).length;
  $("#app").innerHTML=`${header()}
  <div class="stack">
    <div class="row between"><h1>Prospects</h1><button class="btn btn-lime" id="addC" style="padding:10px 16px">＋ Nouveau</button></div>
    ${P?"":`<button class="card lock" id="unlock">
      <div class="row between"><h3>🔒 Parcours de conversation</h3><span class="tag" style="background:var(--lime)">Premium</span></div>
      <p class="muted" style="font-size:.9rem;margin-top:6px">Le bon message au bon moment pour chaque contact, du premier message à la fidélisation, avec les réponses aux objections.</p></button>`}
    <div class="seg" role="tablist">
      <button data-time="due" aria-pressed="${cTime==="due"}">Aujourd'hui <b>${cnt(timeF.due)}</b></button>
      <button data-time="week" aria-pressed="${cTime==="week"}">7 jours <b>${cnt(timeF.week)}</b></button>
      <button data-time="all" aria-pressed="${cTime==="all"}">Toutes <b>${cnt(timeF.all)}</b></button>
    </div>
    ${late&&cTime!=="all"?`<p class="late">⏰ ${late} relance${late>1?"s":""} en retard, affichée${late>1?"s":""} en premier</p>`:""}
    ${S.contacts.length>4?`<input class="input" id="csearch" type="search" placeholder="🔍 Rechercher un prénom, une note…" value="${esc(cSearch)}" style="margin-top:0">`:""}
    <div class="chips">${G.map(([k,n,f])=>`<button class="chip" data-group="${k}" aria-pressed="${cGroup===k}">${n} ${inTime.filter(f).length}</button>`).join("")}</div>
    ${P?`<div class="chips">
      <button class="chip small" data-trk="all" aria-pressed="${cTrack==="all"}">Tous les profils</button>
      <button class="chip small" data-trk="cliente" aria-pressed="${cTrack==="cliente"}">🛍️ Produits</button>
      <button class="chip small" data-trk="revenu" aria-pressed="${cTrack==="revenu"}">💼 Complément de revenu</button>

function journey(c,variant=0){
  const st0=stg(c)[c.stage], fm=c.stage==="premier"&&firstMsg(c);
  const st={...st0,msgs:fm?[["D'après sa source",fm],...st0.msgs]:st0.msgs};
  const v=Math.min(variant,st.msgs.length-1), txt=fillDM(st.msgs[v][1],c), idx=PATH.indexOf(c.stage);
  sheet(`<div class="stack">
    <div class="row between"><h2>${esc(c.name)}</h2><span class="tag" style="background:${COLORS[c.stage]}">${st.name}</span></div>
    <div class="chips wrap"><button class="chip" data-track="cliente" aria-pressed="${c.track!=="revenu"}">🛍️ Cliente</button><button class="chip" data-track="revenu" aria-pressed="${c.track==="revenu"}">💼 Complément de revenu</button></div>
    <div class="stepper">${PATH.map((s,i)=>`<div class="${i<idx?"past":i===idx?"now":""}" style="${i<=idx?`--c:${COLORS[s]}`:""}"><i></i><small>${stg(c)[s].short}</small></div>`).join("")}</div>
    ${c.stage!=="premier"&&c.track!=="revenu"?`<label class="field">Son besoin (il sera repris dans tes messages)<input class="input" id="jb" value="${esc(c.besoin)}" placeholder="Ex. : ${esc(U()[3])}"></label>`:""}
    ${c.track==="revenu"&&c.stage!=="premier"?`<label class="field">Ses envies et contraintes (pour t'en souvenir)<input class="input" id="jb" value="${esc(c.besoin)}" placeholder="Ex. : 5 h par semaine, veut plus de liberté"></label>`:""}
    <div><b style="font-size:.85rem" class="muted">Quel message ?</b><div class="chips wrap" style="margin-top:6px">${st.msgs.map((m,i)=>`<button class="chip" data-var="${i}" aria-pressed="${i===v}">${m[0]}</button>`).join("")}</div></div>
    <div class="prompt-box" id="jmsg">${esc(txt)}</div>
    <p class="muted" style="font-size:.85rem">💡 ${st.tip}</p>
    <button class="btn btn-primary btn-block" id="jcopy">Copier le message</button>
    <div><b>Qu'est-ce qu'elle a répondu ?</b>
      <div class="answers">${st.answers.map((a,i)=>`<button class="opt" data-ans="${i}">${a[0]}</button>`).join("")}</div></div>
    ${c.history.length?`<details><summary class="muted" style="font-size:.9rem">Historique (${c.history.length})</summary>
      <ul class="hist">${c.history.slice(-8).reverse().map(h=>`<li><b>${new Date(h.d).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</b> ${esc(h.t)}</li>`).join("")}</ul></details>`:""}
  </div>`);
  const saveB=()=>{const b=$("#jb");if(b){c.besoin=b.value.trim()}};
  if($("#jb"))$("#jb").oninput=()=>{saveB();$("#jmsg").textContent=fillDM(st.msgs[v][1],c);save()};
  document.querySelectorAll("[data-var]").forEach(b=>b.onclick=()=>{saveB();journey(c,+b.dataset.var)});
  document.querySelectorAll("[data-track]").forEach(b=>b.onclick=()=>{saveB();c.track=b.dataset.track;save();journey(c)});
  $("#jcopy").onclick=()=>copy(fillDM(st.msgs[v][1],c));
  document.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{
    saveB(); const [label,to,delay]=st.answers[+b.dataset.ans];
    c.history.push({d:today(),t:`${st.msgs[v][0]} → ${label.replace(/^\S+\s/,"")}`});
    if(to==="objection"){c.next=addDays(delay);save();return objectionSheet(c)}
    if(to==="noreply"){c.tries++;if(c.tries>=2){c.stage="pause";c.tries=0;c.next=addDays(30);save();closeSheet();contacts();return toast("Pas de réponse deux fois : on laisse respirer 30 jours")}
      c.next=addDays(delay);save();closeSheet();contacts();return toast(`Relance prévue ${fmtD(c.next)} ✓`)}
    c.tries=0;c.stage=to;if(PATH.indexOf(to)>(c.maxStage||0))c.maxStage=PATH.indexOf(to);c.next=addDays(delay);save();
    if(to==="cliente"&&(label.includes("commande")||label.includes("se lance"))){closeSheet();contacts();return sheet(`<div style="text-align:center" class="stack"><div style="width:140px;margin:0 auto" class="float">${mascot("fire","#E4F58A")}</div><h2>${c.track==="revenu"?"Nouvelle partenaire !":"Nouvelle cliente !"}</h2><p class="muted">Bravo 🎉 Je te rappellerai de prendre de ses nouvelles dans une semaine.</p><button class="btn btn-primary btn-block" data-close>Super</button></div>`)}
    if(delay===0)return journey(c);
    closeSheet();contacts();toast(`${c.name} passe en « ${stg(c)[c.stage].name} », relance ${fmtD(c.next)}`);
  });
}

function profileEditor(part){
  const ed=JSON.parse(JSON.stringify(S.profile));

    const body=part==="profil"?`

      <label class="field">Un détail sur toi<textarea class="input" rows="3" data-ei="signature">${esc(ed.signature)}</textarea></label>`
    :`${chipsMulti("tons",TONS,"Ton ton (jusqu'à 3)")}
      ${chipsSingle("adresse")}${chipsSingle("emojis")}${chipsSingle("longueur")}
      ${chipsSingle("visage")}
      ${chipsMulti("plateformes",PLATEFORMES,"Où tu publies")}
      ${chipsSingle("format","Ton format préféré")}`;
    sheet(`<div class="stack"><button class="linkish" id="edBack" style="align-self:flex-start;text-decoration:none">‹ Mon compte</button>
      <h2>${part==="profil"?"Mon profil":"Mon style"}</h2>${body}
      <button class="btn btn-primary btn-block" id="edSave">Enregistrer</button></div>`);
    const sc=$(".sheet");if(drawn)sc.classList.add("still");drawn=true;
    document.querySelectorAll("[data-ei]").forEach(i=>{i.oninput=i.onchange=()=>{ed[i.dataset.ei]=i.value;if(i.dataset.ei==="univers"){const y=sc.scrollTop;draw();$(".sheet").scrollTop=y}}});
    document.querySelectorAll("[data-es]").forEach(b=>b.onclick=()=>{ed[b.dataset.es]=b.dataset.v;const y=sc.scrollTop;draw();$(".sheet").scrollTop=y});
    document.querySelectorAll("[data-em]").forEach(b=>b.onclick=()=>{const k=b.dataset.em,v=b.dataset.v;
      if(ed[k].includes(v))ed[k]=ed[k].filter(x=>x!==v);else{if(k==="tons"&&ed[k].length>=3)return toast("3 tons maximum");ed[k]=[...ed[k],v]}
      const y=sc.scrollTop;draw();$(".sheet").scrollTop=y});
    $("#edBack").onclick=accountSheet;
    $("#edSave").onclick=()=>{
      ed.name=ed.name.trim();ed.produit=ed.produit.trim();
      if(!ed.name)return toast("Ajoute ton prénom");
      if(!ed.produit)return toast("Ajoute ton produit phare");
      if(ed.univers==="✨ Autre"&&!ed.universAutre.trim())return toast("Précise ton univers");
      if(!ed.tons.length)return toast("Choisis au moins un ton");
      if(!ed.plateformes.length)return toast("Choisis au moins une plateforme");
      S.profile=ed;postCtx={type:postCtx.type,subject:postCtx.subject,cible:postCtx.cible};save();
      onCloseCb=null;closeSheet();render();toast("Profil enregistré ✓");
    };
  };
  draw();
}

/* ---------- Activation de l'app ----------
   Gratuit, sans serveur : l'acheteuse active l'app une seule fois avec son email
   et le code d'activation reçu après son achat (email Systeme.io + page de remerciement).
   Pour changer de code : ouvre outils/generer-code.html, saisis le nouveau code,
   copie l'empreinte obtenue et ajoute-la dans la liste ci-dessous.
   Les appareils déjà activés restent actifs quand tu ajoutes ou retires un code.
*/
const ACTIVATION={
  empreintes:["8acafce2abbd6eafd5bfc11021371cf59b36c7bc4666a41d7189b938a48ee257"],
  support:EDITEUR.email
};
const LIC_KEY="bulle-licence";
let AUTH={user:null};
function licence(){try{return JSON.parse(localStorage.getItem(LIC_KEY))}catch(e){return null}}
async function sha256(t){
  if(!(window.crypto&&crypto.subtle))throw new Error("crypto");
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
const normCode=c=>c.toUpperCase().replace(/\s+/g,"").trim();
function boot(){
  const l=licence();
  if(l&&l.email){AUTH.user={email:l.email,date:l.date}}
  initState();render();
  registerSW();
}
function authShell(inner){
  $("#nav").classList.add("hidden");

  authShell(`<h1>Active ton app ${EDITEUR.app}</h1>
    <p class="muted">Saisis l'email utilisé lors de ton achat et le code d'activation reçu par email. Tu ne le feras qu'une seule fois sur cet appareil.</p>
    <label class="field">Ton email<input class="input" id="ac-email" type="email" inputmode="email" autocomplete="email" placeholder="toi@exemple.fr"></label>

    <p class="muted" style="font-size:.82rem">Code introuvable ? Regarde l'email de confirmation de ta commande (pense aux spams), ou écris à ${esc(ACTIVATION.support)}.</p>
    <p class="muted" style="font-size:.82rem">Pas encore d'accès ? <a class="linkish" href="${esc(EDITEUR.site)}" target="_blank" rel="noopener">Découvrir ${EDITEUR.app}</a></p>`);
  const go=()=>activate($("#ac-email").value.trim(),$("#ac-code").value);
  $("#ac-go").onclick=go;$("#ac-code").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function activate(email,code){
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast("Saisis une adresse email valide");
  if(!normCode(code))return toast("Saisis ton code d'activation");
  let h;try{h=await sha256(normCode(code))}catch(e){return toast("Ton navigateur ne permet pas l'activation. Ouvre l'app dans Safari ou Chrome.")}
  if(!ACTIVATION.empreintes.includes(h))return toast("Ce code ne fonctionne pas. Vérifie-le dans ton email d'achat.");
  const lic={email:email.toLowerCase(),date:today()};
  try{localStorage.setItem(LIC_KEY,JSON.stringify(lic))}catch(e){}
  AUTH.user=lic;render();toast("App activée 🎉");
  if(S.profile)setTimeout(()=>installSheet(true),900);else pendingInstall=true;
}

let deferredInstall=null, pendingInstall=false;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function installSheet(auto){
  if(isStandalone()){if(!auto)toast("Magnétik est déjà installée sur cet appareil ✓");return}
  const steps=isIOS()
    ?`<ol class="steps-list"><li>Ouvre cette page dans <b>Safari</b>.</li><li>Appuie sur le bouton <b>Partager</b> (le carré avec une flèche vers le haut).</li><li>Choisis <b>Sur l'écran d'accueil</b>, puis <b>Ajouter</b>.</li></ol>`
    :`<ol class="steps-list"><li>Ouvre cette page dans <b>Chrome</b>.</li><li>Appuie sur le menu <b>⋮</b> en haut à droite.</li><li>Choisis <b>Installer l'application</b> ou <b>Ajouter à l'écran d'accueil</b>.</li></ol>`;
  sheet(`<div class="stack"><div style="width:110px">${mascot("happy","#E4F58A")}</div>
    <h2>Installe Magnétik sur ton téléphone</h2>
    <p class="muted">Tu l'ouvriras d'un seul geste depuis ton écran d'accueil, comme une vraie app, même sans connexion.</p>
    ${deferredInstall?`<button class="btn btn-primary btn-block" id="doInstall">Installer l'app</button>`:steps}
    <button class="btn btn-ghost btn-block" data-close>${auto?"Plus tard":"Fermer"}</button></div>`);
  if($("#doInstall"))$("#doInstall").onclick=async()=>{deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;closeSheet()};
}
function registerSW(){
  if(!("serviceWorker" in navigator)||location.protocol!=="https:"||/claude\.ai|claudeusercontent/.test(location.hostname))return;
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

let onCloseCb=null;
function sheet(html,onClose){
  onCloseCb=onClose||null;
  $("#layer").innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  $("#ov").onclick=e=>{if(e.target.id==="ov")closeSheet()};

function closeSheet(){$("#layer").innerHTML="";const cb=onCloseCb;onCloseCb=null;if(cb)cb()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#ov"))closeSheet()});

boot();
</script>
